<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TecnoFit</title>
    <link rel="stylesheet" href="asset/estilos.css">
    <script src="asset/script.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="logo">
            <h1>TecnoFit</h1>
        </div>

        <nav class="nav">
            <a href="inicio.html">Inicio</a>
            <a href="index.html">Registro</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <section class="login">
        <form id="loginForm" novalidate>
            <h2>Inicio de Sesión - TecnoFit</h2>

            <label for="correo">Correo Electrónico</label>
            <input type="email" name="correo" id="correo" placeholder="Ej: usuario@duoc.cl, usuario@profesor.duoc.cl.">

            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password">
        
            <button type="submit" id="submitLogin">Iniciar Sesión</button>
        </form>
    </section>

    <footer class="footer">
        <p>&copy; 2026 TecnoFit - Todos los derechos reservados</p>
    </footer>
</body>
</html>
