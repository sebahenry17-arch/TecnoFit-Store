<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de usuario | TecnoFit</title>
    <link rel="stylesheet" href="asset/estilos.css">
    <script src="asset/script.js" defer></script>
</head>
<body>
<header class="header">
    <div class="logo">
        <h1>TecnoFit</h1>
    </div>
    <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="registro.html">Registro</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<section class="registro">
    <form id="registroForm">
        <h2>Registro de Usuario - TecnoFit</h2>

        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" maxlength="80" required>

        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" maxlength="60" placeholder="Ej: usuario@duoc.cl" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" required minlength="8">

        <label for="confirmPassword">Confirmar Contraseña</label>
        <input type="password" id="confirmPassword" required>

        <label for="telefono">Teléfono (opcional)</label>
        <input type="tel" id="telefono" placeholder="Ej: 912345678">

        <h3>Dispositivos vinculados</h3>
        <div id="dispositivos"></div>
        <button type="button" id="addDevice">+ Añadir Dispositivo</button>

        <button type="submit">Registrarse</button>
    </form>
</section>
</body>
<footer class="footer">
    <p>&copy; 2026 TecnoFit - Todos los derechos reservados</p>

</footer>
</html>
