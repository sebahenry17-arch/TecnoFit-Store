<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario | TecnoFit</title>
    <link rel="stylesheet" href="asset/estilos.css">
    <script src="asset/script.js" defer></script>
</head>

<body>
    <header class="header">
        <div class="logo">
            <h1>TecnoFit</h1>
        </div>

        <nav class="nav">
            <a href="inicio.html">Inicio</a>
            <a href="index.html">Registro</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <section class="registro">
        <form id="registroForm" novalidate>
            <h2>Registro de Usuario - TecnoFit</h2>

            <label for="nombre">Nombre Completo</label>
            <!-- 'name' para guardar al enviar el formulario -->
            <!-- 'id' para asociar con el label -->
            <!-- 'novalidate' para deshabilitar la validación HTML -->
            <input type="text" name="nombre" id="nombre">

            <label for="correo">Correo Electrónico</label>
            <input type="email" name="correo" id="correo" placeholder="Ej: usuario@duoc.cl, usuario@profesor.duoc.cl.">

            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" minlength="8">

            <label for="confirmPassword">Confirmar Contraseña</label>
            <input type="password" name="confirmPassword" id="confirmPassword">

            <label for="telefono">Teléfono (opcional)</label>
            <input type="tel" name="telefono" id="telefono" placeholder="Ej: 9 1234 5678">

            <h3>Dispositivos vinculados</h3>

            <button type="button" id="addDevice">+ Añadir Dispositivo</button>

            <div id="dispositivos">
                <!-- Aquí se agregarán los elementos HTML de los dispositivos -->

            </div>

            <button type="submit" id="submitRegistro">Registrarse</button>
        </form>
    </section>

    <footer class="footer">
        <p>&copy; 2026 TecnoFit - Todos los derechos reservados</p>
    </footer>
</body>
</html>
